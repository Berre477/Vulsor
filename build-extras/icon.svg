<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Paper-white face with just enough gradient to keep it from looking flat -->
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#fbfcfe"/>
      <stop offset="1"    stop-color="#e9edf4"/>
    </linearGradient>
    <linearGradient id="iris" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"    stop-color="#f87171"/>
      <stop offset="0.55" stop-color="#dc2626"/>
      <stop offset="1"    stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="irisDepth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>
  </defs>

  <!-- Face -->
  <rect x="0" y="0" width="1024" height="1024" rx="226" ry="226" fill="url(#face)"/>

  <!-- The old mark's web, kept as a whisper so the icon still reads as Vulsor -->
  <g stroke="#0f172a" stroke-opacity="0.06" stroke-width="3" fill="none">
    <path d="M512 96 L873 260 L946 620 L731 900 L293 900 L78 620 L151 260 Z"/>
    <path d="M512 240 L760 353 L810 600 L662 793 L362 793 L214 600 L264 353 Z"/>
    <path d="M512 96 V900 M78 620 L946 620 M151 260 L873 900 M873 260 L151 900"/>
  </g>

  <!-- Eight eyes in a jumping spider's arrangement: the two big forward-facing
       ones carry the icon at 16px, the outer pair and the two back rows fill in
       as it grows. -->

  <!-- Back row -->
  <g fill="#0f172a">
    <circle cx="286" cy="694" r="38"/>
    <circle cx="738" cy="694" r="38"/>
  </g>
  <g fill="url(#iris)">
    <circle cx="286" cy="694" r="23"/>
    <circle cx="738" cy="694" r="23"/>
  </g>

  <!-- Middle row, the small pair -->
  <g fill="#0f172a">
    <circle cx="450" cy="668" r="25"/>
    <circle cx="574" cy="668" r="25"/>
  </g>
  <g fill="url(#iris)">
    <circle cx="450" cy="668" r="14"/>
    <circle cx="574" cy="668" r="14"/>
  </g>

  <!-- Front row, outer pair -->
  <circle cx="162" cy="486" r="58" fill="#0f172a"/>
  <circle cx="862" cy="486" r="58" fill="#0f172a"/>
  <circle cx="162" cy="486" r="41" fill="url(#iris)"/>
  <circle cx="862" cy="486" r="41" fill="url(#iris)"/>
  <circle cx="162" cy="486" r="41" fill="url(#irisDepth)"/>
  <circle cx="862" cy="486" r="41" fill="url(#irisDepth)"/>
  <circle cx="148" cy="472" r="12" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="848" cy="472" r="12" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Front row, the two big ones — these carry the icon at small sizes -->
  <circle cx="368" cy="436" r="136" fill="#0f172a"/>
  <circle cx="656" cy="436" r="136" fill="#0f172a"/>
  <circle cx="368" cy="436" r="106" fill="url(#iris)"/>
  <circle cx="656" cy="436" r="106" fill="url(#iris)"/>
  <circle cx="368" cy="436" r="106" fill="url(#irisDepth)"/>
  <circle cx="656" cy="436" r="106" fill="url(#irisDepth)"/>
  <circle cx="368" cy="436" r="42" fill="#0b1220"/>
  <circle cx="656" cy="436" r="42" fill="#0b1220"/>
  <circle cx="320" cy="384" r="27" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="608" cy="384" r="27" fill="#ffffff" fill-opacity="0.9"/>
</svg>
